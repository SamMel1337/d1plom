{% extends 'Search/base.html' %}

{% block title %}Редактировать: {{ form.instance.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <i class="bi bi-pencil"></i> Редактировать запись
                </h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Заголовок:</label>
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Содержание:</label>
                        {{ form.content }}
                    </div>

                    <div class="d-flex justify-content-between">
                        <div>
                            <a href="{% url 'Search:document_detail' form.instance.pk %}" class="btn btn-secondary">
                                Отмена
                            </a>
                            <a href="{% url 'Search:list' %}" class="btn btn-outline-secondary">
                                К списку
                            </a>
                        </div>
                        <button type="submit" class="btn btn-success">
                            Сохранить изменения
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
